apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-scripts
  namespace: monitoring
data:
  script.ts: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    import { Counter } from 'k6/metrics';

    const BASE_URL = __ENV.BASE_URL || 'http://localhost:8080';

    // Zusaetzliche Custom-Metric fuer fehlgeschlagene Registrierungen,
    // ergaenzend zu den eingebauten k6-Metriken (http_req_failed, ...).
    const registrationErrors = new Counter('registration_errors');

    export const options = {
      scenarios: {
        // Kontrolliert steigende (und danach wieder abfallende) Last auf
        // /users/register: Start bei 0 VUs, schrittweise Steigerung bis
        // zu einem Peak von 50 VUs, Halten des Peaks und anschliessender
        // kontrollierter Abbau zurueck auf 0 VUs.
        register_ramp: {
          executor: 'ramping-vus',
          startVUs: 0,
          stages: [
            { duration: '1m', target: 5 }, // sanfter Einstieg
            { duration: '2m', target: 20 }, // steigende Last
            { duration: '2m', target: 50 }, // Ramp-up zum Peak
            { duration: '3m', target: 50 }, // Peak-Last halten
            { duration: '2m', target: 0 }, // kontrollierter Abbau
          ],
          gracefulRampDown: '30s',
        },
      },
      thresholds: {
        http_req_failed: ['rate<0.05'],
        'http_req_duration{endpoint:register}': ['p(95)<1500'],
      },
    };

    function randomString(length: number): string {
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    export default function () {
      // Pro Iteration eine eindeutige E-Mail, da User.email einen
      // Unique-Constraint besitzt (siehe User.java).
      const uniqueSuffix = `${__VU}-${__ITER}-${randomString(8)}`;
      const payload = JSON.stringify({
        firstName: 'Load',
        lastName: 'Test',
        email: `load-test-${uniqueSuffix}@example.ch`,
        password: `Passw0rd!${uniqueSuffix}`,
      });

      const params = {
        headers: { 'Content-Type': 'application/json' },
        tags: { endpoint: 'register' },
      };

      const res = http.post(`${BASE_URL}/users/register`, payload, params);

      const success = check(res, {
        'Status ist 201 Created': (r) => r.status === 201,
        'Antwort enthaelt eine User-ID': (r) => {
          if (!r.body) {
            return false;
          }
          try {
            return !!JSON.parse(r.body as string).id;
          } catch {
            return false;
          }
        },
      });

      if (!success) {
        registrationErrors.add(1);
      }

      // Kurze Pause zwischen Iterationen, um eher realistisches
      // Nutzerverhalten statt maximal moeglichen Durchsatz zu simulieren.
      sleep(1);
    }
