apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-mgmt-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MikeGarda/vsc-ops.git
    targetRevision: main
    path: helm
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: user-mgmt-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
