apiVersion: v1
kind: Secret
# Der prometheus-operator liest die Alertmanager-Konfiguration aus dem Secret
# "alertmanager-<crname>" (hier: alertmanager-kube-prometheus-stack-alertmanager).
# Der kube-prometheus-stack legt ein gleichnamiges Default-Secret an; da diese
# Datei die zweite Quelle der Multi-Source-Application ist, gewinnt sie
# (ArgoCD: "last source wins").
type: Opaque
metadata:
  name: alertmanager-kube-prometheus-stack-alertmanager
  namespace: monitoring
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      # Default: alles verwerfen. Der Stack bringt viele Standard-Alerts mit
      # (u. a. "Watchdog", der IMMER feuert, und Control-Plane-Alerts, die auf
      # DOKS nicht messbar sind) - die sollen den Kanal nicht zuspammen.
      receiver: 'null'
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Nur Alerts unserer eigenen PrometheusRule (Label team=user-mgmt,
        # siehe helm/templates/prometheusrule.yaml) gehen an ntfy.
        - receiver: 'ntfy'
          matchers:
            - team = "user-mgmt"

    receivers:
      - name: 'null'
      - name: 'ntfy'
        webhook_configs:
          # Topic "k8s" steht im PFAD -> ntfy veroeffentlicht den Request-Body
          # (Alertmanager-JSON) als Nachricht in diesem Topic.
          - url: 'https://ntfy.everyonehasabadday.ch/k8s'
            send_resolved: true
            http_config:
              # Token kommt aus dem Secret "ntfy-token" (Key "token"), das per
              # alertmanagerSpec.secrets (monitoring/values.yaml) nach
              # /etc/alertmanager/secrets/ntfy-token/ gemountet wird.
              authorization:
                type: Bearer
                credentials_file: '/etc/alertmanager/secrets/ntfy-token/token'
