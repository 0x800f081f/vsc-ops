# Aufgabe 6: Zusaetzliches Grafana-Dashboard fuer den module_service
# (Request Rate, Response Time, Error Rate + CPU/Memory vs. Limits).
# Der Grafana-Sidecar laedt jede ConfigMap mit Label grafana_dashboard="1".
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-module-service
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  module-service.json: |
    {
      "title": "module_service",
      "uid": "module-service",
      "tags": [
        "aufgabe-6",
        "module-service"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request Rate",
          "description": "Anfragen pro Sekunde je Endpunkt (ohne /metrics und Health-Checks).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (method, handler) (rate(http_requests_total{namespace=~\"$namespace\", job=\"module-service\"}[$__rate_interval]))",
              "legendFormat": "{{method}} {{handler}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Response Time (p50 / p95 / p99)",
          "description": "Antwortzeit-Quantile aller Requests.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\", job=\"module-service\"}[$__rate_interval])))",
              "legendFormat": "p50"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\", job=\"module-service\"}[$__rate_interval])))",
              "legendFormat": "p95"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\", job=\"module-service\"}[$__rate_interval])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Error Rate (5xx, %)",
          "description": "Anteil Server-Fehler an allen Requests.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "100 * sum(rate(http_requests_total{namespace=~\"$namespace\", job=\"module-service\", status=\"5xx\"}[$__rate_interval])) / clamp_min(sum(rate(http_requests_total{namespace=~\"$namespace\", job=\"module-service\"}[$__rate_interval])), 1e-9)",
              "legendFormat": "5xx %"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Client-Fehler (4xx) je Endpunkt",
          "description": "z. B. 404 = Modul existiert nicht (fehlerhafte Zuweisung).",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (handler) (rate(http_requests_total{namespace=~\"$namespace\", job=\"module-service\", status=\"4xx\"}[$__rate_interval]))",
              "legendFormat": "{{handler}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU: Verbrauch vs. Limit",
          "description": "Vertikale Skalierung: Verbrauch pro Pod und gesetztes Limit.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", container=\"module-service\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "B",
              "expr": "max(kube_pod_container_resource_limits{namespace=~\"$namespace\", container=\"module-service\", resource=\"cpu\"})",
              "legendFormat": "Limit"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memory: Verbrauch vs. Limit",
          "description": "Working Set pro Pod und gesetztes Limit.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\", container=\"module-service\"})",
              "legendFormat": "{{pod}}"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "refId": "B",
              "expr": "max(kube_pod_container_resource_limits{namespace=~\"$namespace\", container=\"module-service\", resource=\"memory\"})",
              "legendFormat": "Limit"
            }
          ]
        }
      ],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(http_requests_total{job=\"module-service\"}, namespace)",
              "refId": "ns"
            },
            "definition": "label_values(http_requests_total{job=\"module-service\"}, namespace)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "annotations": {
        "list": []
      }
    }
