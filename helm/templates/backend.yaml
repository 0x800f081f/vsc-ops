apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    {{- include "user-mgmt.labels" . | nindent 4 }}
spec:
  # KEIN replicas: die Anzahl steuert der HPA (sonst wuerde ArgoCD jeden Sync zuruecksetzen)
  strategy:                        # --- Aufgabe 6: RollingUpdate ohne Unterbruch ---
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # nie einen Pod abschalten, bevor der neue bereit ist
      maxSurge: 1                  # dafuer voruebergehend einen zusaetzlichen Pod
  selector:
    matchLabels:
      {{- include "user-mgmt.selectorLabels" "backend" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "user-mgmt.selectorLabels" "backend" | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: {{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
            # Aufgabe 4: Verbindungsdaten der Managed PostgreSQL (von Terraform angelegt)
            - secretRef:
                name: db-credentials
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          # Der JVM-Start kann 30–90s dauern. Solange läuft NUR die
          # Startup-Probe (Liveness/Readiness sind pausiert).
          startupProbe: 
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.backend.port }}
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.backend.port }}
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.backend.port }}
              scheme: HTTP
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "user-mgmt.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "user-mgmt.selectorLabels" "backend" | nindent 4 }}
  ports:
    # Benannter Port: der ServiceMonitor (Aufgabe 1, Orchestrierung & Observability)
    # referenziert Endpunkte über den Port-Namen.
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
