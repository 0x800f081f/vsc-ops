{{- if .Values.networkPolicy.enabled }}
# 1) Nur GLEICHER Namespace - eingehend UND ausgehend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  labels:
    {{- include "user-mgmt.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
# 2) DNS-Ausnahme (Egress) - sonst keine Namensauflösung.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  labels:
    {{- include "user-mgmt.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 3) Ingress-Ausnahme: nginx-Controller darf das Frontend erreichen.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  labels:
    {{- include "user-mgmt.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
---
# 4) Orchestrierung & Observability / Aufgabe 1: Prometheus (Namespace
# "monitoring") darf die Metrik-Endpunkte des Backends scrapen.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring
  labels:
    {{- include "user-mgmt.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      # Aufgabe 6: auch der module_service wird von Prometheus gescrapt
      - key: app
        operator: In
        values: [backend, module_service]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
        - protocol: TCP
          port: {{ .Values.module_service.port }}
---
# Aufgabe 4: Das Backend darf die Managed PostgreSQL erreichen (liegt ausserhalb
# des Clusters im VPC). Ohne diese Ausnahme blockiert allow-same-namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  labels:
    {{- include "user-mgmt.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.database.postgresCidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.database.port }}
{{- if .Values.module_service.enabled }}
---
# Aufgabe 6: NUR der module_service darf zur Managed MySQL. Das Backend hat
# dafuer weder Zugangsdaten noch (bei /32-CIDR) einen Netzwerkpfad.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mysql
  labels:
    {{- include "user-mgmt.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: module_service
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.database.mysqlCidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.database.port }}
{{- end }}
{{- end }}