apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "user-mgmt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:                        # --- Aufgabe 6: RollingUpdate ohne Unterbruch ---
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "user-mgmt.selectorLabels" "frontend" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "user-mgmt.selectorLabels" "frontend" | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: {{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NEXT_PUBLIC_API_URL
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          # --- Aufgabe 6: Probes (GET / antwortet mit 307 -> zaehlt als gesund) ---
          startupProbe:
            httpGet:
              path: /api/health/readiness
              port: {{ .Values.frontend.port }}
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health/readiness
              port: {{ .Values.frontend.port }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /api/health/liveness
              port: {{ .Values.frontend.port }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "user-mgmt.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "user-mgmt.selectorLabels" "frontend" | nindent 4 }}
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
