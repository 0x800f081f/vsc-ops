# ============================================================
# BASIS-Werte (Defaults). Werden je Umgebung von
# values-staging.yaml / values-prod.yaml ueberschrieben.
# images.*.tag wird von der CI-Pipeline aktualisiert (Promotion) -
# seit der 2-Branch-Strategie ausschliesslich in den Umgebungsdateien
# (values-staging.yaml / values-prod.yaml), nicht mehr hier.
# ============================================================

# images: Repository + Tag aller Images (backend, frontend, module_service)
# stehen ausschliesslich in values-staging.yaml / values-prod.yaml - dorthin
# schreibt die CI-Pipeline bei der Promotion (Single Source of Truth).
# Seit Aufgabe 4 gibt es kein Postgres-Image mehr (Managed PostgreSQL).
# Backend: KEIN 'replicas' - die Replica-Zahl wird vom HPA gesteuert (Aufgabe 6).
backend:
  port: 8080
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {cpu: 400m, memory: 512Mi}
  autoscaling: # --- Aufgabe 6: HPA ---
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget: # --- Aufgabe 6: PDB ---
    enabled: true
    minAvailable: 1
frontend:
  replicas: 1
  port: 3000
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 300m, memory: 384Mi}
# --- Aufgabe 6: module_service ---
# enabled schaltet Deployment, Service, ServiceMonitor und DB-NetworkPolicy
# pro Umgebung ein (Default aus; Staging/Prod aktivieren ihn in ihrer Datei).
module_service:
  enabled: false
  replicas: 1
  port: 8080
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 300m, memory: 384Mi}
# DB-Verbindung des Backends (URL/User/Passwort) kommt seit Aufgabe 4 aus dem
# Secret db-credentials, die des module_service aus module-service-db (beide Terraform).
config:
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  JWT_ISSUER: "Spring"
  JWT_EXPIRATION_MILLIS: "86400000"
  NEXT_PUBLIC_API_URL: "http://backend:8080"
  MODULE_SERVICE_LOG_LEVEL: "INFO"
  # Managed MySQL erzwingt TLS -> SSL darf NICHT deaktiviert sein
  MODULE_SERVICE_MYSQL_SSL_DISABLED: "false"
  # Aufgabe 6: Adresse des module_service fuer den REST-Client des Backends
  # (Kubernetes-Service-Name im selben Namespace)
  MODULE_SERVICE_URL: "http://module-service:8080"
ingress:
  enabled: true # Default; wird pro Umgebung ueberschrieben (nur prod hat einen Ingress)
  className: nginx
  annotations: {}
  paths:
    - path: /
      service: frontend
      port: 3000
# --- Aufgabe 5: Ressourcen-Deckel pro Namespace ---
resourceQuota:
  enabled: true
  requests: {cpu: "1", memory: 1Gi}
  limits: {cpu: "2", memory: 2Gi}
# --- Aufgabe 5: Netzwerk-Isolation zwischen Namespaces ---
networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  dnsNamespace: kube-system
  # Orchestrierung & Observability / Aufgabe 1: Prometheus-Scrape aus diesem
  # Namespace auf die Backend-Metriken erlauben (siehe allow-monitoring).
  monitoringNamespace: monitoring
  # Aufgabe 4/6: Zugriff auf die Managed-Datenbanken (liegen im VPC, Port 25060).
  # Backend -> nur PostgreSQL, module_service -> nur MySQL.
  # 10.0.0.0/8 = ganzes privates Netz. Enger machen: die private IP der
  # jeweiligen DB als /32 eintragen (siehe docs), dann kann das Backend die
  # MySQL auch netzwerktechnisch nicht erreichen.
  database:
    port: 25060
    postgresCidr: 10.0.0.0/8
    mysqlCidr: 10.0.0.0/8
# --- Orchestrierung & Observability / Aufgabe 1: Monitoring ---
# Erzeugt einen ServiceMonitor für das Backend, damit Prometheus die
# Applikationsmetriken (Request Rate, Response Time, Error Rate) erfasst.
monitoring:
  enabled: true
  scrapeInterval: 30s
  # Aufgabe 1: Schwellenwerte der eigenen PrometheusRule (templates/prometheusrule.yaml)
  rules:
    enabled: true
    loginFailuresPerSecond: 0.5   # > 0.5/s = mehr als 30 fehlgeschlagene Logins pro Minute
    loginFailuresFor: 1m
    errorRatePercent: 5           # > 5 % der Requests mit HTTP 5xx
    errorRateFor: 5m
    backendDownFor: 2m
